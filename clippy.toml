msrv = "1.88"

# Proper names and acronyms that appear in documentation. Without this list, the doc_markdown lint asks for
# backticks around each of them.
doc-valid-idents = [
    "AAC", "AMF", "CRSF", "ESC", "FFmpeg", "FFprobe", "GPS", "H.264", "H.265", "HEVC", "INAV", "MD5", "MP4",
    "NVENC", "OSD", "PCM", "QSV", "RGBA", "SRT", "VAAPI", "VideoToolbox", "WAV", "YUV", "iced", "IMU", "RSSI",
    "SNR", "ffmpeg", "ffprobe", "AVC", "HDR", "DPI",
]
