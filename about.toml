# cargo-about configuration. `make notices` writes THIRD_PARTY_NOTICES.md from it.
#
# Only what ships in the application is listed: the dependencies of the `flight-replay` crate for every system it is
# built for. The development tools and the test dependencies are not part of the release.

accepted = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
